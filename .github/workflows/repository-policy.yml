name: Repository Policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON schema documents
        run: |
          python3 -m pip install --disable-pip-version-check --quiet -r requirements-release.txt
          python3 <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema_paths = (
              Path("schemas/aircraft-package-manifest.schema.json"),
              Path("schemas/release-index.schema.json"),
              Path("schemas/resource-package-manifest.schema.json"),
          )
          for schema_path in schema_paths:
              with schema_path.open(encoding="utf-8") as handle:
                  schema = json.load(handle)
              Draft202012Validator.check_schema(schema)
              print(f"Validated {schema_path}")
          PY

      - name: Test release preparation helpers
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Reject tracked release and aircraft payloads
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          forbidden_names = {
              "release-index.json",
              "SHA256SUMS.txt",
          }
          forbidden_suffixes = (
              ".7z",
              ".zip",
              ".tar",
              ".tar.gz",
              ".tgz",
              ".gz",
              ".manifest.json",
              ".ac",
              ".acf",
              ".afl",
              ".bank",
              ".dll",
              ".dylib",
              ".obj",
              ".snd",
              ".so",
              ".xpl",
          )

          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
          ).splitlines()
          forbidden = [
              path
              for path in tracked
              if Path(path).name in forbidden_names
              or path.lower().endswith(forbidden_suffixes)
          ]

          if forbidden:
              print("Release and aircraft payloads must be GitHub Release assets only:")
              for path in forbidden:
                  print(f"  - {path}")
              sys.exit(1)
          PY
